[project]
name = "churnguard-ai-backend"
version = "1.0.0"
description = "FastAPI backend for explainable customer churn prediction and retention analytics"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.2",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.13,<3.0",
    "pandas==2.2.3",
    "numpy==2.3.5",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    "SQLAlchemy==2.0.50",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "kagglehub[pandas-datasets]>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
# This is an application repository; run code from the project directory rather than building a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
